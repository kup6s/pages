version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      k8s:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      golang-x:
        patterns:
          - "golang.org/x/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker base images (Dockerfile.operator, Dockerfile.syncer)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Images referenced by the Helm chart: the nginx tag in values.yaml.
  # Daily, because nginx patch releases are mostly security fixes.
  - package-ecosystem: "helm"
    directory: "/charts/kup6s-pages"
    schedule:
      interval: "daily"
    ignore:
      # nginx stays on the stable branch (even minor number); odd minors are mainline.
      # The chart unit test rejects a mainline tag as well.
      - dependency-name: "*nginx*"
        versions: ["1.31.x", "1.33.x", "1.35.x", "1.37.x", "1.39.x"]
