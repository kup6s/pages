name: Set up Hugo
description: Install the Hugo version the docs are built with

runs:
  using: composite
  steps:
    - name: Install Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        # 0.170 dropped the extended edition; the theme's Sass then needs Dart Sass (#181)
        hugo-version: '0.169.0'
        extended: true
