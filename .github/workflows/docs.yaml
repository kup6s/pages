name: Deploy Docs

# Manual trigger only. Docs are automatically built after releases in release.yaml.
# Use this workflow for testing docs changes or rebuilding without a release.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags, for the version of the newest release

      - name: Setup Hugo
        uses: ./.github/actions/setup-hugo

      - name: Generate build info
        run: |
          VERSION=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          VERSION=${VERSION#v}
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          mkdir -p docs/data
          cat > docs/data/build.yaml << EOF
          version: "${VERSION}"
          date: "${BUILD_DATE}"
          EOF

      - name: Build docs
        run: hugo --source docs --minify

      - name: Deploy to docs branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: docs
          publish_dir: ./docs/public
          force_orphan: true
