suite: nginx deployment tests
templates:
  - templates/deployment-nginx.yaml
tests:
  - it: should render with default values
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 2

  - it: should use default nginx image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/library/nginx:1.29-alpine

  - it: should mount PVC as read-only
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sites
            mountPath: /sites
            readOnly: true

  - it: should mount nginx config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nginx-config
            mountPath: /etc/nginx/conf.d

  - it: should have pod anti-affinity by default
    asserts:
      - isNotEmpty:
          path: spec.template.spec.affinity.podAntiAffinity

  - it: should keep the replicas of one revision on different schedulable nodes by default
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: nginx
              matchLabelKeys:
                - pod-template-hash

  - it: should select its own pods in the default spread constraint
    asserts:
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/component: nginx
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value:
            app.kubernetes.io/component: nginx

  - it: should render no spread constraints for an empty list
    set:
      nginx.topologySpreadConstraints: []
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: should render custom spread constraints instead of the default
    set:
      nginx:
        topologySpreadConstraints:
          - maxSkew: 2
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                example.com/tier: web
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 2
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  example.com/tier: web

  - it: should keep serving for 5 seconds after termination starts by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: ["sleep", "5"]

  - it: should take the pause before termination from nginx.preStopSleepSeconds
    set:
      nginx.preStopSleepSeconds: 10
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: ["sleep", "10"]

  - it: should render no preStop hook when nginx.preStopSleepSeconds is 0
    set:
      nginx.preStopSleepSeconds: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle

  - it: should have liveness probe
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 80

  - it: should have readiness probe
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health

  - it: should set custom replicas
    set:
      nginx.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should include component label
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: nginx

  - it: should roll the pods when the nginx config changes
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: '^[0-9a-f]{64}$'

  - it: should keep the config checksum next to custom pod annotations
    set:
      nginx:
        podAnnotations:
          example.com/team: web
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/team"]
          value: web
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: '^[0-9a-f]{64}$'

  - it: should set no priority class by default
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName

  - it: should set the priority class from nginx.priorityClassName
    set:
      nginx.priorityClassName: example-low
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: example-low
