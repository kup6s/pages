apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kup6s-pages.fullname" . }}-nginx
  namespace: {{ include "kup6s-pages.namespace" . }}
  labels:
    {{- include "kup6s-pages.nginx.labels" . | nindent 4 }}
data:
  default.conf: |
{{- if .Values.nginx.customConfig }}
{{ .Values.nginx.customConfig | indent 4 }}
{{- else }}
    # Public path prefix removed by Traefik's stripPrefix middleware, which
    # reports it in X-Forwarded-Prefix. Only plain path segments are accepted,
    # so a client-supplied header can never point a redirect to another host.
    map $http_x_forwarded_prefix $public_prefix {
        default "";
        "~^(?<prefix>(/[A-Za-z0-9._~%-]+)+)/?$" $prefix;
    }

    # The still-encoded request path without the /<site> segment that
    # Traefik's addPrefix middleware put in front of it.
    map $request_uri $site_path {
        default "";
        "~^/[^/?]+(?<path>/[^?]*)" $path;
    }

    server {
        listen 80;
        server_name _;

        # Redirects stay relative, so the browser keeps scheme and host.
        absolute_redirect off;

        # Health Check Endpoint
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Serve all sites from /sites
        # Traefik does the addPrefix, so:
        # Request: www.customer.com/about.html
        # Traefik: addPrefix /customer-website
        # nginx sees: /customer-website/about.html
        # Served: /sites/customer-website/about.html

        root /sites;

        # Never serve git metadata (.git directory or .git file)
        location ~ (^|/)\.git(/|$) {
            return 404;
        }

        location / {
            # A directory requested without trailing slash is redirected to
            # its public URL with a slash, so relative links resolve. nginx's
            # built-in redirect would expose the internal /<site> path.
            set $dir_redirect "";
            if (-d $request_filename) {
                set $dir_redirect "yes";
            }
            if ($uri ~ /$) {
                set $dir_redirect "";
            }
            if ($dir_redirect = "yes") {
                return 301 $public_prefix$site_path/$is_args$args;
            }

            # Try file, then directory, then index.html
            try_files $uri $uri/ $uri/index.html =404;

            # Nested regexes are matched in order and win over the one above,
            # so git metadata is denied before the asset rule can serve it.
            location ~ (^|/)\.git(/|$) {
                return 404;
            }

            # Caching for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Custom 404 page (if available)
        error_page 404 /404.html;

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    }
{{- end }}
